networks:
    docker-modx-network:
        driver: bridge
        name: docker_modx_network

services:
    modx_nginx:
        container_name: modx_nginx
        build:
            context: ./
            dockerfile: docker/nginx/Dockerfile
        volumes:
            - ./site/modx:/var/www/modx
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
            - ./docker/nginx/settings.conf:/etc/nginx/settings.conf
            - ./docker/nginx/ssl:/etc/nginx/certs
        ports:
            - "80:80"
            - "443:443"
        expose:
            - 80
        networks:
            - docker-modx-network
        depends_on:
            site: { condition: service_started }
            phpmyadmin: { condition: service_started }

    site:
        container_name: site
        build:
            context: ./
            dockerfile: ./docker/php-fpm8.5/Dockerfile
        networks:
            - docker-modx-network
        volumes:
            - ./site/modx:/var/www/modx
            - ./site/resources:/var/www/modx/resources
            - ./site/uploads:/var/www/modx/uploads
            - ./site/.modx-cli:/var/www/modx/.modx-cli
        depends_on:
            - db_modx

    db_modx:
        container_name: db_modx
        image: mysql:5.7
        restart: always
        command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USER}
        networks:
            - docker-modx-network
        volumes:
            - ./docker/mysql/volume:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/my.cnf

    phpmyadmin:
        container_name: phpmyadmin
        depends_on:
            - db_modx
        image: phpmyadmin
        restart: always
        ports:
            - "8090:80"
        environment:
            PMA_HOST: ${DB_HOST}
            PMA_USER: root
            PMA_PASSWORD: ${DB_PASSWORD}
            PMA_PORT: 3306
        networks:
            - docker-modx-network